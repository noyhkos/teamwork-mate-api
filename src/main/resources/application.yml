spring:
  application:
    name: teamworkmate-api

  datasource:
    url: jdbc:postgresql://localhost:5433/teamworkmate
    username: twm
    password: twm-local

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never by JPA
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

calc:
  base-url: http://localhost:3001

# direct = run inline (tests), memory = background worker thread (local dev).
# SQS replaces this in the deployed stack without touching callers.
queue:
  mode: ${QUEUE_MODE:memory}

llm:
  # Blank key disables the phrase layer entirely — reports fall back to templates.
  gemini:
    api-key: ${GEMINI_API_KEY:}
  generation-model: ${LLM_GENERATION_MODEL:gemini-3.6-flash}
  # Distinct judge model to reduce self-preference bias. Gemini 3 series only
  # (response_format JSON schema), and a -lite tier so the free-tier request
  # quota is not exhausted by the second call of every phrase.
  judge-model: ${LLM_JUDGE_MODEL:gemini-3.5-flash-lite}
