spring:
  application:
    name: teamworkmate-api

  datasource:
    url: jdbc:postgresql://localhost:5433/teamworkmate
    username: twm
    password: twm-local

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never by JPA
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
